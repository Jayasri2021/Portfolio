<section class="projects-section" aria-labelledby="projects-title" #scrollShell [style.height.px]="shellHeight">
  <div class="projects-stage">
    <header class="projects-heading">
      <div>
        <p class="section-kicker">III · Selected Work</p>
        <h2 id="projects-title">Projects.</h2>
      </div>
      <!-- <p class="section-intro">Software and AI systems built around real problems, measurable outcomes, and reliable engineering.</p> -->
    </header>

    <div class="rail-viewport" #railViewport>
      <div class="projects-rail" #projectsRail aria-label="Project case studies"
        [style.transform]="'translate3d(' + (-translateX) + 'px, 0, 0)'">
        <article class="project-card" *ngFor="let proj of projects; let i = index">
          <a class="project-image" [href]="proj.link" target="_blank" rel="noopener noreferrer"
            [attr.aria-label]="'View ' + proj.title + ' repository'">
            <img *ngIf="proj.image" [src]="proj.image" [alt]="proj.title + ' preview'" />
            <span class="view-label">View case study ↗</span>
          </a>
          <div class="project-content">
            <div class="project-heading">
              <h3>{{ proj.title }}</h3>
            </div>
            <p>{{ proj.bullets[0] }}</p>
            <div class="project-footer">
              <div class="project-tech" aria-label="Technologies used">
                <span *ngFor="let tech of proj.techStack.slice(0, 4)">{{ tech }}</span>
              </div>
              <a [href]="proj.link" target="_blank" rel="noopener noreferrer" aria-label="Open repository">↗</a>
            </div>
          </div>
        </article>
      </div>
    </div>

    <div class="rail-caption" aria-hidden="true"><span>Scroll to explore</span><i></i></div>
    <div class="all-projects">
      <button (click)="viewOtherProj()" class="explore-button">
        <span>Explore all projects</span><i aria-hidden="true">↗</i>
      </button>
    </div>
  </div>
</section>
