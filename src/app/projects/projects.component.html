<div class="projects-section">
  <h2 class="section-title">Projects</h2>
  <div class="parent">
    <div class="projects-list">
      <div class="project-card" *ngFor="let proj of projects; let i = index" [class.reverse]="i % 2 !== 0">
        <!-- Project Visual -->
        <div class="project-visual">
          <div class="image-container">
            <img *ngIf="proj.image" [src]="proj.image" [alt]="proj.title" class="project-img" />
            <div class="image-overlay">
              <a [href]="proj.link" target="_blank" class="overlay-link">
                <span>View Repository</span>
                <img src="../../assets/Link-Icon.svg" alt="Link" />
              </a>
            </div>
          </div>
        </div>

        <!-- Project Info -->
        <div class="project-info">
          <div class="project-header">
            <span class="project-num">0{{ i + 1 }}</span>
            <h3 class="project-title">{{ proj.title }}</h3>
          </div>

          <div class="project-details">
            <div class="detail-group">
              <h4 class="detail-label">Objective & Use Case</h4>
              <p class="detail-text">{{ proj.useCase }}</p>
            </div>

            <div class="detail-group">
              <h4 class="detail-label">Technologies Used</h4>
              <div class="tech-tags">
                <span class="tech-tag" *ngFor="let tech of proj.techStack.split(',')">{{ tech.trim() }}</span>
              </div>
            </div>
          </div>

          <div class="project-footer">
            <a [href]="proj.link" target="_blank" class="github-btn">
              Explore on GitHub
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" class="link-arrow">
                <line x1="7" y1="17" x2="17" y2="7"></line>
                <polyline points="7 7 17 7 17 17"></polyline>
              </svg>
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- More Projects Button -->
    <div id="other-proj">
      <button (click)="viewOtherProj()" class="btn btn-primary">
        See All Projects <img src="../../assets/Link-Icon.svg" alt="Link" />
      </button>
    </div>
  </div>
</div>
