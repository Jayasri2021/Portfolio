<div class="projects-section">
  <h2 class="section-title">Stuff I Built</h2>

  <div class="parent">
    <div class="projects-list">
      <article class="project-card" *ngFor="let proj of projects; let i = index">
        <!-- Project Visual -->
        <div class="project-visual">
          <div class="image-container">
            <img *ngIf="proj.image" [src]="proj.image" [alt]="proj.title" class="project-img" />
            <div class="image-overlay">
              <a [href]="proj.link" target="_blank" rel="noopener noreferrer" class="overlay-link">
                <span>View Repository</span>
                <img src="../../assets/Link-Icon.svg" alt="Link" />
              </a>
            </div>
          </div>
        </div>

        <!-- Project Info -->
        <div class="project-info">
          <div class="project-header">
            <div class="project-meta">
              <span class="project-num">0{{ i + 1 }}</span>
            </div>
            <h3 class="project-title">{{ proj.title }}</h3>
          </div>

          <ul class="project-points">
            <li *ngFor="let point of proj.bullets">{{ point }}</li>
          </ul>

          <div class="project-tech" aria-label="Technologies used">
            <span *ngFor="let tech of proj.techStack">{{ tech }}</span>
          </div>

        </div>
      </article>

    </div>

    <!-- More Projects Button -->
    <div id="other-proj">
      <button (click)="viewOtherProj()" class="btn btn-primary">
        See All Git Projects <img src="../../assets/Link-Icon.svg" alt="Link" />
      </button>
    </div>
  </div>
</div>
