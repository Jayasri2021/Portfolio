<div class="projects-section">
  <p id="pro-logo">Projects</p>
  <div class="parent">
    <div class="Main-pro">
      <div id="proj" *ngFor="let proj of projects">
        <a [href]="proj.link" target="_blank">
          <div class="media-wrapper">
            <img *ngIf="proj.image" [src]="proj.image" [alt]="proj.title" class="static-img" />
          </div>
          <div class="content-wrapper">
            <h3>{{ proj.title }}</h3>
            <div class="project-info">
              <p><strong></strong> {{ proj.useCase }}</p>
              <p><strong>Tech Stack:</strong> {{ proj.techStack }}</p>
            </div>
          </div>
        </a>
      </div>
    </div>
    <div id="other-proj">
      <button (click)="viewOtherProj()">
        Other Projects! <img src="../../assets/Link-Icon.svg" alt="Link" />
      </button>
    </div>
  </div>
</div>
