<app-header></app-header>

<main id="home" class="hero">
  <div class="hero__container">
    <div class="hero__content">
      <p class="hero__eyebrow">Jayasri Suresh Vani · Portfolio</p>
      <h1 class="hero__title">Building reliable<br><span>AI-driven systems</span><br>from data to product.</h1>
      <p class="hero__role" aria-label="Software Engineer, Applied AI and Machine Learning, Data Engineering">
        <span>Currently creating as </span>
        <strong [ngClass]="roleColorClass">{{ displayedRole }}</strong>
        <i aria-hidden="true"></i>
      </p>
      <!-- <p class="hero__desc">I design production-ready software, data pipelines, and intelligent experiences with clarity, practical impact, and reliable engineering.</p> -->
      <div class="hero__actions">
        <a class="hero-btn" href="assets/resume-papers/Jayasri_Suresh_Vani_Resume.pdf"
          download="Jayasri_Suresh_Vani_Resume.pdf">
          <span>Resume</span><i aria-hidden="true">↓</i>
        </a>
        <a class="hero-btn" href="#projects">
          <span>Explore work</span><i aria-hidden="true">↓</i>
        </a>
      </div>
    </div>

    <div class="hero__media">
      <div class="portrait-frame" #avatar oncontextmenu="return false;">
        <!-- <span class="frame-label">Open to opportunities</span> -->
        <div class="avatar">
          <img src="../../assets/profile-pic.jpeg" alt="Jayasri Suresh Vani" draggable="false" />
        </div>
        <!-- <span class="frame-index">01 / 07</span> -->
      </div>
    </div>
  </div>
</main>
<app-journey id="journey"></app-journey>
<app-projects id="projects"></app-projects>
<app-skills id="skills"></app-skills>
<!-- Certifications are temporarily hidden. Keep the component available for future use.
<app-certification id="certifications"></app-certification>
-->
<app-resume id="experience"></app-resume>
<app-contact id="contact"></app-contact>
