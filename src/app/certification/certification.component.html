<div class="certification-section">
  <h2 class="section-title">Certifications</h2>

  <div class="certifications-grid">
    <div class="cert-card-badge" *ngFor="let cert of certifications">
      <div class="badge-frame">
        <div class="badge-top">
          <span class="user-name">Jayasri<br>Suresh Vani</span>
        </div>

        <div class="badge-bar" [style.background-color]="cert.color">
          {{ cert.title }}
        </div>

        <div class="badge-bottom">
          <span class="cert-provider">{{ cert.provider }}</span>
          <div class="badge-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
            </svg>
          </div>
        </div>
      </div>
      <a [href]="cert.link" target="_blank" class="view-cert-overlay">View Certificate</a>
    </div>
  </div>
</div>
