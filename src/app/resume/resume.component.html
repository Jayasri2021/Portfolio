<section class="experience-section">
  <div class="container">
    <h2 class="section-title">Publications</h2>

    <div class="experience-grid">
      <div class="experience-card" *ngFor="let item of timelineData">
        <div class="card-inner">
          <div class="card-front">
            <div class="card-img-wrapper" *ngIf="item.icon">
              <!-- Using object-fit contain/cover depending on image type -->
              <img [src]="item.icon" alt="Experience Image">
            </div>
          </div>
          <div class="card-back">
            <div class="card-date" *ngIf="item.duration">{{ item.duration }}</div>
            <h3 class="card-title">{{ item.title }}</h3>
            <h4 class="card-subtitle">{{ item.subtitle }}</h4>
            <p class="card-desc">{{ item.description }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
