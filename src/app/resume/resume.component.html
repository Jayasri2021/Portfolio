<section class="research-section" aria-labelledby="research-title">
  <div class="research-container">
    <header class="research-heading">
      <p class="section-kicker">V · Research archive</p>
      <h2 id="research-title">Academic Research & Publications.</h2>
    </header>

    <div class="research-grid">
      <article class="research-card" *ngFor="let item of timelineData">
        <a class="research-cover" *ngIf="item.link" [href]="item.link" target="_blank" rel="noopener noreferrer"
          [attr.aria-label]="(item.linkLabel || 'View document') + ': ' + item.subtitle">
          <img *ngIf="item.icon" [src]="item.icon" [alt]="item.subtitle + ' preview'">
          <span class="cover-shade" aria-hidden="true"></span>
          <span class="cover-action">Open research ↗</span>
        </a>
        <div class="research-content">
          <p class="research-type">{{ item.title }}</p>
          <h3>{{ item.subtitle }}</h3>
          <div class="research-footer">
            <a *ngIf="item.link" [href]="item.link" target="_blank" rel="noopener noreferrer">
              {{ item.linkLabel || 'View document' }} <i aria-hidden="true">↗</i>
            </a>
          </div>
        </div>
      </article>
    </div>
  </div>
</section>
