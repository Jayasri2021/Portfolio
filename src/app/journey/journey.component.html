<section class="journey-section" aria-labelledby="journey-title">
  <div class="journey-container">
    <header class="journey-heading">
      <p class="section-kicker">II · Journey</p>
      <h2 id="journey-title">Where I’ve grown.</h2>
    </header>

    <div class="journey-table" role="list" aria-label="Career and education journey">
      <article class="journey-row" *ngFor="let item of educationData; let i = index"
        [class.education]="item.category === 'education'" role="listitem">
        <div class="journey-period">
          <time>{{ item.duration }}</time>
        </div>

        <div class="journey-role">
          <span class="journey-type">{{ item.category === 'education' ? 'Education' : 'Experience' }}</span>
          <h3>{{ item.title }}</h3>
          <p>{{ item.subtitle }}</p>
        </div>

        <div class="journey-summary">
          <ul *ngIf="item.category === 'experience'">
            <li *ngFor="let point of getWorkBullets(item.title)">{{ point }}</li>
          </ul>
          <p *ngIf="item.category === 'education'">{{ item.description }}</p>
        </div>
      </article>
    </div>
  </div>
</section>
