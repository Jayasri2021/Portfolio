<header class="header">
  <div class="header-content">
    <button class="logo" type="button" (click)="scrollToSection('home')" aria-label="Go to intro">
      JSV<span>.</span>
    </button>

    <nav class="nav-desktop" aria-label="Portfolio sections">
      <a [class.active]="activeSection === 'home'" (click)="scrollToSection('home')">Intro</a>
      <a [class.active]="activeSection === 'journey'" (click)="scrollToSection('journey')">Journey</a>
      <a [class.active]="activeSection === 'projects'" (click)="scrollToSection('projects')">Project Work</a>
      <a [class.active]="activeSection === 'skills'" (click)="scrollToSection('skills')">Skills</a>
      <a [class.active]="activeSection === 'experience'" (click)="scrollToSection('experience')">Publications</a>
      <a [class.active]="activeSection === 'contact'" (click)="scrollToSection('contact')">Contact</a>
    </nav>

    <div class="header-actions">
      <a class="resume-link" href="assets/resume-papers/Jayasri_Suresh_Vani_Resume.pdf" target="_blamk"
        download="Jayasri_Suresh_Vani_Resume.pdf">Resume
        <span aria-hidden="true">↗</span>
      </a>
      <button class="mobile-menu-btn" (click)="toggleMenu()" aria-label="Open menu">
        <span></span><span></span>
      </button>
    </div>
  </div>

  <div class="mobile-menu" [class.open]="isMenuOpen">
    <button class="close-btn" (click)="toggleMenu()" aria-label="Close menu">&times;</button>
    <a [class.active]="activeSection === 'home'" (click)="scrollToSection('home')">Intro</a>
    <a [class.active]="activeSection === 'journey'" (click)="scrollToSection('journey')">Journey</a>
    <a [class.active]="activeSection === 'projects'" (click)="scrollToSection('projects')">Project Work</a>
    <a [class.active]="activeSection === 'skills'" (click)="scrollToSection('skills')">Skills</a>
    <a [class.active]="activeSection === 'experience'" (click)="scrollToSection('experience')">Publications</a>
    <a [class.active]="activeSection === 'contact'" (click)="scrollToSection('contact')">Contacts</a>
    <a class="mobile-resume" href="../../assets/resume-papers/Jayasri_Suresh_Vani_Resume.pdf" target="_blank"
      rel="noopener noreferrer">Resume ↗</a>
  </div>
  <div class="header-progress" [style.width.%]="scrollProgress" aria-hidden="true"></div>
</header>
