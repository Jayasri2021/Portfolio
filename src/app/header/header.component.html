<header class="header">
  <div class="container header-content">
    <div class="logo" (click)="scrollToSection('home')">
      <span>Jsv</span>
    </div>

    <nav class="nav-desktop">
      <!-- <a [class.active]="activeSection === 'home'" (click)="scrollToSection('home')">Home</a> -->
      <a [class.active]="activeSection === 'journey'" (click)="scrollToSection('journey')">Journey</a>

      <a [class.active]="activeSection === 'skills'" (click)="scrollToSection('skills')">Skills</a>
      <a [class.active]="activeSection === 'projects'" (click)="scrollToSection('projects')">Projects</a>
      <a [class.active]="activeSection === 'certifications'"
        (click)="scrollToSection('certifications')">Certifications</a>
      <a [class.active]="activeSection === 'experience'" (click)="scrollToSection('experience')">Publications</a>
    </nav>

    <div class="header-actions">
      <button class="theme-toggle" (click)="toggleTheme()" aria-label="Toggle Theme">
        <!-- Sun Icon -->
        <svg *ngIf="!isDark" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <!-- Moon Icon -->
        <svg *ngIf="isDark" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <button class="mobile-menu-btn" (click)="toggleMenu()" aria-label="Open Menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Menu Overlay -->
  <div class="mobile-menu" [class.open]="isMenuOpen">
    <button class="close-btn" (click)="toggleMenu()">&times;</button>
    <a [class.active]="activeSection === 'home'" (click)="scrollToSection('home')">Home</a>
    <a [class.active]="activeSection === 'journey'" (click)="scrollToSection('journey')">Journey</a>
    <a [class.active]="activeSection === 'skills'" (click)="scrollToSection('skills')">Skills</a>
    <a [class.active]="activeSection === 'projects'" (click)="scrollToSection('projects')">Projects</a>
    <a [class.active]="activeSection === 'certifications'"
      (click)="scrollToSection('certifications')">Certifications</a>
    <a [class.active]="activeSection === 'experience'" (click)="scrollToSection('experience')">Publications</a>
  </div>
</header>
